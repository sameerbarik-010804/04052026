name: Salesforce PR Validation

on:
  pull_request:
    branches:
      - SIT
      - QA
      - UAT
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version
      - name: Create JWT Key File
        run: |
          echo "${{ secrets.SERVER_KEY }}" > server.key
          chmod 600 server.key
      - name: Select Target Org Based on PR Destination Branch
        run: |
          echo "PR Target Branch: ${{ github.base_ref }}"
          if [ "${{ github.base_ref}" = "SIT" ]; then
            echo "SF_USERNAME=${{ secrets.SIT_USERNAME }}" >> $GITHUB_ENV
            echo "SF_INSTANCE_URL=${{ secrets.SIT_INSTANCE_URL }}" >> $GITHUB_ENV
          elif [ "${{ github.base_ref}" = "QA" ]; then
            echo "SF_USERNAME=${{ secrets.QA_USERNAME }}" >> $GITHUB_ENV
            echo "SF_INSTANCE_URL=${{ secrets.QA_INSTANCE_URL }}" >> $GITHUB_ENV
          elif [ "${{ github.base_ref}" = "UAT" ]; then
            echo "SF_USERNAME=${{ secrets.UAT_USERNAME }}" >> $GITHUB_ENV
            echo "SF_INSTANCE_URL=${{ secrets.UAT_INSTANCE_URL }}" >> $GITHUB_ENV
          elif [ "${{ github.base_ref}" = "main" ]; then
            echo "SF_USERNAME=${{ secrets.PROD_USERNAME }}" >> $GITHUB_ENV
            echo "SF_INSTANCE_URL=${{ secrets.PROD_INSTANCE_URL }}" >> $GITHUB_ENV
          else
            echo "Invalid target branch"
            exit 1
      - name: Authenticate Salesforce Org Using JWT
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CLIENT_ID }}" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias targetOrg \
            --set-default
      - name: Install Salesforce Delta Plugin
        run: |
          echo "y" | sf plugins install sfdx-git-delta
      - name: Generate Delta package.xml
        run: |
          mkdir -p delta
          git fetch origin ${{ github.base_ref }}
          sf sgd source delta \
            --to HEAD \
            --from origin/${{ github.base_ref }} \
            --output delta \
            --generate-delta
          echo "Generated package.xml:"
          cat delta/package/package.xml
      - name: Validate Delta Package Against Target Org
        run: |
          PACKAGE_XML="delta/package/package.xml"
          if [ ! -f "$PACKAGE_XML" ]; then
            echo "package.xml not found"
            exit 1
          fi
          if ! grep -q "<types>" "$PACKAGE_XML"; then
            echo "No metadata changes found. Skipping validation."
            exit 0
          fi
          sf project deploy validate \
            --target-org targetOrg \
            --manifest "$PACKAGE_XML" \
            --test-level RunLocalTests \
            --wait 60 \
            --ignore-warnings \
            --json > deploy-result.json
          cat deploy-result.json
      - name: Check Validation Result
        run: |
          STATUS=$(jq -r '.status' deploy-result.json)
          DEPLOY_STATUS=$(jq -r '.result.status // empty' deploy-result.json)
          echo "CLI Status: $STATUS"
          echo "Deployment Status: $DEPLOY_STATUS"
          if [ "$STATUS" != "0" ]; then
            echo "Validation failed"
            exit 1
          fi
          if [ "$DEPLOY_STATUS" != "Succeeded" ]; then
            echo "Deployment validation failed"
            exit 1
          fi
          echo "Validation passed successfully"
