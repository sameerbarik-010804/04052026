name: Validate PR Deployment by Environment

on:
  pull_request:
    branches:
      - SIT
      - QA
      - UAT
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Determine environment-specific secrets and vars
      - name: Set environment variables for SF org
        id: set-env
        run: |
          BRANCH=${{ github.event.pull_request.base.ref }}
          echo "Target branch: $BRANCH"
      
          case "$BRANCH" in
            SIT)
              echo "consumer_key=${{ secrets.SIT_CONSUMER_KEY }}" >> $GITHUB_ENV
              
              echo "jwt_key_base64<<EOF" >> $GITHUB_ENV
              echo "${{ secrets.SIT_JWT_KEY_BASE64 }}" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              
              echo "sf_username=${{ secrets.SIT_USERNAME }}" >> $GITHUB_ENV
              echo "instance_url=https://login.salesforce.com" >> $GITHUB_ENV
              ;;
            QA)
              echo "consumer_key=${{ secrets.QA_CONSUMER_KEY }}" >> $GITHUB_ENV
      
              echo "jwt_key_base64<<EOF" >> $GITHUB_ENV
              echo "${{ secrets.QA_JWT_KEY_BASE64 }}" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
      
              echo "sf_username=${{ secrets.QA_USERNAME }}" >> $GITHUB_ENV
              echo "instance_url=https://test.salesforce.com" >> $GITHUB_ENV
              ;;
            UAT)
              echo "consumer_key=${{ secrets.UAT_CONSUMER_KEY }}" >> $GITHUB_ENV
      
              echo "jwt_key_base64<<EOF" >> $GITHUB_ENV
              echo "${{ secrets.UAT_JWT_KEY_BASE64 }}" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
      
              echo "sf_username=${{ secrets.UAT_USERNAME }}" >> $GITHUB_ENV
              echo "instance_url=https://login.salesforce.com" >> $GITHUB_ENV
              ;;
            main)
              echo "consumer_key=${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_QA }}" >> $GITHUB_ENV
      
              echo "jwt_key_base64<<EOF" >> $GITHUB_ENV
              echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
      
              echo "sf_username=${{ secrets.SFDX_AUTH_EMAMI_QA_USERNAME }}" >> $GITHUB_ENV
              echo "instance_url=https://login.salesforce.com" >> $GITHUB_ENV
              ;;
            *)
              echo "Unsupported branch '$BRANCH'. Failing."
              exit 1
              ;;
          esac
          echo "Using SF username: $sf_username"

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version
      - name: Install Salesforce Code Analyzer Plugin
        run: sf plugins install @salesforce/sfdx-scanner@latest

      - name: Generate JWT Key for org
        shell: bash
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
  
      # Authenticate using JWT
      - name: Authenticate via JWT
        run: |
          sf org login jwt \
            --client-id "$consumer_key" \
            --jwt-key-file server.key \
            --username "$sf_username" \
            --instance-url "$instance_url" 

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-command: run
          run-arguments: --normalize-severity --target . --outfile results.json --json --verbose
          results-artifact-name: salesforce-code-analyzer-results

      - name: Salesforce Scanner Report
        run: |
          echo "| Rule Id | Severity | File | Line | Message |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          jq -r '.[] | "|"+(.ruleId // "n/a")+"|"+(.severity // "n/a")+"|"+(.file // "n/a")+"|"+((.line|tostring) // "n/a")+"|"+(.message // "n/a")+"|"' results.json >> $GITHUB_STEP_SUMMARY

      - name: Check the outputs to determine whether to fail
        if: |
          steps.run-code-analyzer.outputs.exit-code > 0 ||
          steps.run-code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.run-code-analyzer.outputs.num-violations > 10
        run: exit 1
        
      # Run deployment validation including test coverage
      - name: Validate deployment with test coverage
        id: deploy-validate
        run: |
          SFDX_Package_Gen: ${{ github.workspace }}/manifest/$BRANCH_package.xml
          DEPLOY_RESULT=$(sf project deploy validate \
            --target-org "$sf_username" \
            -x ${SFDX_Package_Gen} \
            --test-level RunLocalTests \
            --wait 20 \
            --ignore-warnings \
            --json)

          echo "$DEPLOY_RESULT" > deploy-result.json

          STATUS=$(jq -r '.result.status' deploy-result.json)
          TEST_COVERAGE=$(jq -r '.result.details?.testCoverage' deploy-result.json)

          # Fallback: If .testCoverage is not found, try another path or fail gracefully
          if [ -z "$TEST_COVERAGE" ] || [ "$TEST_COVERAGE" == "null" ]; then
            echo "Test coverage information not found in the deployment result."
            exit 1
          fi

          echo "Deployment status: $STATUS"
          echo "Test coverage: $TEST_COVERAGE%"

          if [ "$STATUS" != "Succeeded" ]; then
            echo "Deployment validation failed."
            exit 1
          fi

          COVERAGE_INT=${TEST_COVERAGE%.*}
          if [ "$COVERAGE_INT" -lt 75 ]; then
            echo "Test coverage ($TEST_COVERAGE%) is less than required 75%."
            exit 1
          fi

      - name: Success message
        if: success()
        run: echo "Deployment validation succeeded with test coverage >= 75%"
