name: EMAMI Deployment Pipeline Test

on:
  workflow_dispatch:
    inputs:
      Feature_Branch:
        type: string
        description: Please Enter Branch To Deploy in Environment.
        required: true
      environment:
        type: choice
        description: Please Select The Deployment Environment.
        options:
          - EMAMI QA
          - EMAMI QAGlobal
          - EMAMI UAT
          - EMAMI HOTFIX
        default: EMAMI QA
        required: true
      testlevel:
        type: choice
        description: "Select Test class Run Type"
        options:
          - NoTestRun
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
        default: RunSpecifiedTests
        required: true
      specifiedclass:
        type: string
        description: Please Enter Test Class Names (comma separated).
        required: false

  push:
    branches:
      - Dev
      - qaglobal
      - uat
      - hotfix

jobs:
  Deployment_Job:
    runs-on: ubuntu-latest

    env:
      SF_LOGIN_URL_TEST: https://test.salesforce.com
      SF_LOGIN_URL_PROD: https://login.salesforce.com
      SF_ALIAS: emamiOrg

      # Set inputs or fallback to github refs for push event
      FEATURE_BRANCH: ${{ github.event.inputs.Feature_Branch != '' && github.event.inputs.Feature_Branch || github.ref_name }}
      ENVIRONMENT: ${{ github.event.inputs.environment != '' && github.event.inputs.environment || (
        github.ref == 'refs/heads/Dev' && 'EMAMI QA' || 
        github.ref == 'refs/heads/qaglobal' && 'EMAMI QAGlobal' || 
        github.ref == 'refs/heads/uat' && 'EMAMI UAT' || 
        github.ref == 'refs/heads/hotfix' && 'EMAMI HOTFIX' 
        || 'EMAMI QA'
      ) }}
      TEST_LEVEL: ${{ github.event.inputs.testlevel != '' && github.event.inputs.testlevel || 'RunSpecifiedTests' }}
      SPECIFIED_CLASS: ${{ github.event.inputs.specifiedclass || '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sfdx --version

      - name: Generate JWT Key file
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set org credentials based on environment
        id: set-org
        run: |
          case "${{ env.ENVIRONMENT }}" in
            "EMAMI QA")
              echo "CLIENT_ID=${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_QA }}" >> $GITHUB_OUTPUT
              echo "USERNAME=${{ secrets.SFDX_AUTH_EMAMI_QA_USERNAME }}" >> $GITHUB_OUTPUT
              echo "LOGIN_URL=${{ env.SF_LOGIN_URL_TEST }}" >> $GITHUB_OUTPUT
              ;;
            "EMAMI QAGlobal")
              echo "CLIENT_ID=${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_QAGLOBAL }}" >> $GITHUB_OUTPUT
              echo "USERNAME=${{ secrets.SFDX_AUTH_EMAMI_QAGLOBAL_USERNAME }}" >> $GITHUB_OUTPUT
              echo "LOGIN_URL=${{ env.SF_LOGIN_URL_TEST }}" >> $GITHUB_OUTPUT
              ;;
            "EMAMI UAT")
              echo "CLIENT_ID=${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_UAT }}" >> $GITHUB_OUTPUT
              echo "USERNAME=${{ secrets.SFDX_AUTH_EMAMI_UAT_USERNAME }}" >> $GITHUB_OUTPUT
              echo "LOGIN_URL=${{ env.SF_LOGIN_URL_PROD }}" >> $GITHUB_OUTPUT
              ;;
            "EMAMI HOTFIX")
              echo "CLIENT_ID=${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_HOTFIX }}" >> $GITHUB_OUTPUT
              echo "USERNAME=${{ secrets.SFDX_AUTH_EMAMI_HOTFIX_USERNAME }}" >> $GITHUB_OUTPUT
              echo "LOGIN_URL=${{ env.SF_LOGIN_URL_PROD }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unknown environment ${{ env.ENVIRONMENT }}"
              exit 1
              ;;
          esac

      - name: Authenticate to Salesforce Org
        run: |
          echo "Logging out of previous sessions..."
          sfdx force:auth:logout --all --noprompt || true

          echo "Logging into ${ENVIRONMENT} org with user ${{ steps.set-org.outputs.USERNAME }}"
          sfdx force:auth:jwt:grant \
            --clientid ${{ steps.set-org.outputs.CLIENT_ID }} \
            --jwtkeyfile server.key \
            --username ${{ steps.set-org.outputs.USERNAME }} \
            --instanceurl ${{ steps.set-org.outputs.LOGIN_URL }} \
            --setdefaultdevhubusername

          sfdx force:org:display --targetusername ${{ steps.set-org.outputs.USERNAME }}

      - name: Run Salesforce Code Analyzer
        id: run-scanner
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-command: run
          run-arguments: --normalize-severity --target . --outfile results.json --json --verbose
          results-artifact-name: salesforce-code-analyzer-results

      - name: Display Salesforce Scanner Report
        run: |
          echo "| Rule Id | Severity | File | Line | Message |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          jq -r '.[] | "|"+(.ruleId // "n/a")+"|"+(.severity // "n/a")+"|"+(.file // "n/a")+"|"+((.line|tostring) // "n/a")+"|"+(.message // "n/a")+"|"' results.json >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical violations found
        if: |
          steps.run-scanner.outputs.exit-code > 0 ||
          steps.run-scanner.outputs.num-sev1-violations > 0 ||
          steps.run-scanner.outputs.num-violations > 10
        run: exit 1

      - name: Check Manifest exists
        run: |
          MANIFEST="${{ github.workspace }}/manifest/${{ env.FEATURE_BRANCH }}_package.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Manifest file $MANIFEST not found."
            exit 1
          fi

      - name: Prepare test classes if RunSpecifiedTests
        id: prepare-tests
        run: |
          if [[ "${{ env.TEST_LEVEL }}" == "RunSpecifiedTests" ]]; then
            if [[ -z "${{ env.SPECIFIED_CLASS }}" ]]; then
              TEST_CLASS_FILE="${{ github.workspace }}/manifest/${{ env.FEATURE_BRANCH }}_testclass.txt"
              if [[ ! -f "$TEST_CLASS_FILE" ]]; then
                echo "ERROR: Test class file $TEST_CLASS_FILE not found and no specifiedclass input provided."
                exit 1
              fi
              TEST_CLASSES=$(paste -sd "," "$TEST_CLASS_FILE")
              echo "Using test classes from file: $TEST_CLASSES"
              echo "test_classes=$TEST_CLASSES" >> $GITHUB_OUTPUT
            else
              echo "Using specified test classes: ${{ env.SPECIFIED_CLASS }}"
              echo "test_classes=${{ env.SPECIFIED_CLASS }}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Deployment Validation (CheckOnly)
        shell: bash
        run: |
          MANIFEST="${{ github.workspace }}/manifest/${{ env.FEATURE_BRANCH }}_package.xml"
          echo "Validating deployment of manifest: $MANIFEST"

          if [[ "${{ env.TEST_LEVEL }}" == "RunSpecifiedTests" ]]; then
            sf project deploy validate --manifest "$MANIFEST" --target-org "${{ steps.set-org.outputs.USERNAME }}" --test-level RunSpecifiedTests --tests "${{ steps.prepare-tests.outputs.test_classes }}" --wait 30
          else
            sf project deploy validate --manifest "$MANIFEST" --target-org "${{ steps.set-org.outputs.USERNAME }}" --test-level "${{ env.TEST_LEVEL }}" --wait 30
          fi

      - name: Deploy to Salesforce Org
        shell: bash
        run: |
          MANIFEST="${{ github.workspace }}/manifest/${{ env.FEATURE_BRANCH }}_package.xml"
          echo "Deploying manifest: $MANIFEST"

          if [[ "${{ env.TEST_LEVEL }}" == "RunSpecifiedTests" ]]; then
            sf project deploy --manifest "$MANIFEST" --target-org "${{ steps.set-org.outputs.USERNAME }}" --test-level RunSpecifiedTests --tests "${{ steps.prepare-tests.outputs.test_classes }}" --wait 10
          else
            sf project deploy --manifest "$MANIFEST" --target-org "${{ steps.set-org.outputs.USERNAME }}" --test-level "${{ env.TEST_LEVEL }}" --wait 10
          fi

      - name: Cleanup JWT key
        if: always()
        run: rm -f server.key