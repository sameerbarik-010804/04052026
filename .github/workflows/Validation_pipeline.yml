name: EMAMI Validation Pipeline val

on:
  workflow_dispatch:
    inputs:
      Feature_Branch:
        type: string
        description: Please Enter Branch To validate in Environment.
        required: true
      environment:
        type: choice
        description: Please Select The Validation Environment.
        options:
          - EMAMI QA
          - EMAMI QAGlobal
          - EMAMI UAT
          - EMAMI HOTFIX
        default: "EMAMI QA"
        required: true
      testlevel:
        type: choice
        description: Select Test class Run Type.
        options:
          - NoTestRun
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
        default: "RunSpecifiedTests"
        required: true
      specifiedclass:
        type: string
        description: Please Enter Test Class Names (comma separated).
        required: false

  push:
    branches:
      - main
      - SIT
      - QA
      - UAT

jobs:
  Validation_Job:
    runs-on: ubuntu-latest
    env:
      SF_ENV_ALIAS: emamiOrg
      SF_LOGIN_URL_TEST: https://test.salesforce.com
      SF_LOGIN_URL_PROD: https://login.salesforce.com

      # Determine branch to use:
      FEATURE_BRANCH: ${{ github.event.inputs.Feature_Branch != '' && github.event.inputs.Feature_Branch || github.ref_name }}

      # Determine environment to use with fallback:
      ENVIRONMENT: ${{ github.event.inputs.environment != ''}}

      # Determine test level to use:
      TEST_LEVEL: ${{ github.event.inputs.testlevel != '' && github.event.inputs.testlevel || 'RunSpecifiedTests' }}

      # Specified class, might be empty string:
      SPECIFIED_CLASS: ${{ github.event.inputs.specifiedclass != '' && github.event.inputs.specifiedclass || '' }}

    steps:
      - name: Checkout branch (Feature Branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      - name: Install Salesforce Code Analyzer Plugin
        run: sf plugins install @salesforce/sfdx-scanner@latest || echo "Plugin already installed"

      - name: Generate JWT Key file
        run: echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key && chmod 600 server.key

      - name: Authorize to Salesforce Org
        run: |
          LOGIN_URL=$SF_LOGIN_URL_TEST
          case "${{ env.ENVIRONMENT }}" in
            "EMAMI UAT"|"EMAMI HOTFIX")
              LOGIN_URL=$SF_LOGIN_URL_PROD
              ;;
          esac

          case "${{ env.ENVIRONMENT }}" in
            "EMAMI QA")
              CLIENT_ID="${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_QA }}"
              USERNAME="${{ secrets.SFDX_AUTH_EMAMI_QA_USERNAME }}"
              ;;
            "EMAMI QAGlobal")
              CLIENT_ID="${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_QAGLOBAL }}"
              USERNAME="${{ secrets.SFDX_AUTH_EMAMI_QAGLOBAL_USERNAME }}"
              ;;
            "EMAMI UAT")
              CLIENT_ID="${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_UAT }}"
              USERNAME="${{ secrets.SFDX_AUTH_EMAMI_UAT_USERNAME }}"
              ;;
            "EMAMI HOTFIX")
              CLIENT_ID="${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_HOTFIX }}"
              USERNAME="${{ secrets.SFDX_AUTH_EMAMI_HOTFIX_USERNAME }}"
              ;;
            *)
              echo "Unknown environment: ${{ env.ENVIRONMENT }}"
              exit 1
              ;;
          esac

          echo "Logging out previous sessions..."
          sf org logout --all --no-prompt || true

          echo "Authorizing to Salesforce org (${USERNAME}) with client id ${CLIENT_ID} on login url ${LOGIN_URL}..."
          sf org login jwt --client-id "${CLIENT_ID}" --jwt-key-file server.key --username "${USERNAME}" --instance-url "${LOGIN_URL}" --alias "$SF_ENV_ALIAS" --set-default

          sf org display --target-org "$SF_ENV_ALIAS"

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-command: run
          run-arguments: --normalize-severity --target . --outfile results.json --json --verbose
          results-artifact-name: salesforce-code-analyzer-results

      - name: Display Salesforce Scanner Report Summary
        run: |
          echo "| Rule Id | Severity | File | Line | Message |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          jq -r '.[] | "|"+(.ruleId // "n/a")+"|"+(.severity // "n/a")+"|"+(.file // "n/a")+"|"+((.line|tostring) // "n/a")+"|"+(.message // "n/a")+"|"' results.json >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical errors found in scanner output
        if: |
          steps.run-code-analyzer.outputs.exit-code > 0 ||
          steps.run-code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.run-code-analyzer.outputs.num-violations > 10
        run: exit 1

      - name: Determine test classes for RunSpecifiedTests, if needed
        id: prepare_tests
        run: |
          if [[ "${{ env.TEST_LEVEL }}" == "RunSpecifiedTests" ]]; then
            if [ -n "${{ env.SPECIFIED_CLASS }}" ]; then
              echo "Using specified test classes from input"
              TEST_CLASSES="${{ env.SPECIFIED_CLASS }}"
            else
              TEST_FILE="${{ github.workspace }}/manifest/${{ env.FEATURE_BRANCH }}_TestClass.txt"
              if [[ -f "$TEST_FILE" ]]; then
                TEST_CLASSES=$(paste -sd "," "$TEST_FILE")
                echo "Read test classes from file: $TEST_CLASSES"
              else
                echo "Error: Test classes file not found at '$TEST_FILE' and no classes specified via input"
                exit 1
              fi
            fi
            echo "test_classes=$TEST_CLASSES" >> $GITHUB_OUTPUT
          fi

      - name: Deployment Validation (CheckOnly)
        shell: bash
        run: |
          PACKAGE_XML="${{ github.workspace }}/manifest/${{ env.FEATURE_BRANCH }}_package.xml"
          echo "Validating deployment with package: $PACKAGE_XML"
          
          if [[ "${{ env.TEST_LEVEL }}" == "RunSpecifiedTests" ]]; then
            TESTS="${{ steps.prepare_tests.outputs.test_classes }}"
            echo "Deploy with RunSpecifiedTests: $TESTS"
            sf project deploy validate --manifest "$PACKAGE_XML" --target-org "$SF_ENV_ALIAS" --test-level RunSpecifiedTests --tests "$TESTS" --wait 30
          else
            echo "Deploy with test level: ${{ env.TEST_LEVEL }}"
            sf project deploy validate --manifest "$PACKAGE_XML" --target-org "$SF_ENV_ALIAS" --test-level "${{ env.TEST_LEVEL }}" --wait 30
          fi

      - name: Actual Deployment
        shell: bash
        run: |
          PACKAGE_XML="${{ github.workspace }}/manifest/${{ env.FEATURE_BRANCH }}_package.xml"
          echo "Deploying package: $PACKAGE_XML"

          if [[ "${{ env.TEST_LEVEL }}" == "RunSpecifiedTests" ]]; then
            TESTS="${{ steps.prepare_tests.outputs.test_classes }}"
            echo "Deploying with RunSpecifiedTests: $TESTS"
            sf project deploy --manifest "$PACKAGE_XML" --target-org "$SF_ENV_ALIAS" --test-level RunSpecifiedTests --tests "$TESTS" --wait 10
          else
            echo "Deploying with test level: ${{ env.TEST_LEVEL }}"
            sf project deploy --manifest "$PACKAGE_XML" --target-org "$SF_ENV_ALIAS" --test-level "${{ env.TEST_LEVEL }}" --wait 10
          fi

      - name: Cleanup
        run: rm -f server.key