name: Salesforce Deploy and Validate

on:
  workflow_dispatch:
    inputs:
      BRANCH_NAME:
        description: 'Branch to checkout and deploy'
        required: true
        default: main
      TEST_LEVEL:
        description: 'Salesforce test level'
        required: true
        default: RunLocalTests
        type: choice
        options:
          - RunSpecifiedTests
          - RunLocalTests
          - RunAllTestsInOrg

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SF_ALIAS: targetOrg

    steps:
    - name: Checkout branch
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.BRANCH_NAME }}

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install Salesforce CLI
      run: npm install sfdx-cli --global

    - name: Install Java (required for PMD scanner)
      run: sudo apt-get update && sudo apt-get install -y openjdk-11-jre-headless

    - name: Download and unzip PMD Salesforce ruleset
      run: |
        wget https://github.com/pmd/pmd/releases/download/pmd_releases/6.59.0/pmd-bin-6.59.0.zip
        unzip -o pmd-bin-6.59.0.zip
        echo "${PWD}/pmd-bin-6.59.0" > pmd_dir.txt

    - name: Run Salesforce Scanner (PMD)
      run: |
        PMD_HOME=$(cat pmd_dir.txt)
        $PMD_HOME/bin/run.sh pmd \
          -d force-app/main/default/classes \
          -R salesforce-best-practices \
          -f text

    - name: Prepare JWT key file
      run: |
        echo "${{ secrets.SF_JWT_KEY }}" > server.key
        chmod 600 server.key

    - name: Authenticate to Salesforce Org using JWT
      env:
        SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
        SF_USERNAME: ${{ secrets.SF_USERNAME }}
        SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL || 'https://login.salesforce.com' }}
      run: |
        sf --version

        echo "Logging out any existing sessions..."
        sf org logout --all --no-prompt || true

        echo "Authenticating to Salesforce org..."
        sf org login jwt \
          --client-id $SF_CONSUMER_KEY \
          --jwt-key-file server.key \
          --username $SF_USERNAME \
          --instance-url $SF_LOGIN_URL \
          --alias $SF_ALIAS \
          --set-default

        sf org display --target-org $SF_ALIAS

    - name: Validate deployment (Check Only)
      run: |
        TEST_LEVEL="${{ github.event.inputs.TEST_LEVEL }}"
        MANIFEST_PATH="manifest/package.xml"
        if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
          echo "RunSpecifiedTests requires test classes file."
          TEST_CLASSES_FILE="manifest/test_classes.txt"
          if [ ! -f "$TEST_CLASSES_FILE" ]; then
            echo "Error: test classes file '$TEST_CLASSES_FILE' not found."
            exit 1
          fi
          TEST_CLASSES=$(paste -sd "," "$TEST_CLASSES_FILE")
          echo "Validating deployment with tests: $TEST_CLASSES"
          sf project deploy validate \
            --manifest "$MANIFEST_PATH" \
            --target-org $SF_ALIAS \
            --test-level RunSpecifiedTests \
            --tests "$TEST_CLASSES" \
            --wait 30
        else
          echo "Validating deployment with test level: $TEST_LEVEL"
          sf project deploy validate \
            --manifest "$MANIFEST_PATH" \
            --target-org $SF_ALIAS \
            --test-level $TEST_LEVEL \
            --wait 30
        fi

    - name: Deploy to Salesforce Org
      run: |
        TEST_LEVEL="${{ github.event.inputs.TEST_LEVEL }}"
        MANIFEST_PATH="manifest/package.xml"
        if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
          TEST_CLASSES_FILE="manifest/test_classes.txt"
          TEST_CLASSES=$(paste -sd "," "$TEST_CLASSES_FILE")
          echo "Deploying with tests: $TEST_CLASSES"
          sf project deploy \
            --manifest "$MANIFEST_PATH" \
            --target-org $SF_ALIAS \
            --test-level RunSpecifiedTests \
            --tests "$TEST_CLASSES" \
            --wait 10
        else
          echo "Deploying with test level: $TEST_LEVEL"
          sf project deploy \
            --manifest "$MANIFEST_PATH" \
            --target-org $SF_ALIAS \
            --test-level $TEST_LEVEL \
            --wait 10
        fi

    - name: Cleanup JWT key file
      run: rm -f server.key