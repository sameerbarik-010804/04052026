name: EMAMI Validation Pipeline val

on:
  workflow_dispatch:
    inputs:
      Feature_Branch:
        type: string
        description: Please Enter Branch To validate in Environment.
        required: true
      environment:
        type: choice
        description: Please Select The Validation Environment.
        options:
          - EMAMI QA
          - EMAMI QAGlobal
          - EMAMI UAT
          - EMAMI HOTFIX
        default: "EMAMI QA"
        required: true
      testlevel:
        type: choice
        description: Select Test class Run Type.
        options:
          - NoTestRun
          - RunLocalTests
          - RunSpecifiedTests
          - RunAllTestsInOrg
        default: "RunSpecifiedTests"
        required: true
      specifiedclass:
        type: string
        description: Please Enter Test Class Names (comma separated).
        required: false

jobs:
  Validation_Job:
    runs-on: ubuntu-latest
    env:
      # Map environment based on input choice - add mapping if needed here
      SF_ENV_ALIAS: emamiOrg
      SF_LOGIN_URL_TEST: https://test.salesforce.com
      SF_LOGIN_URL_PROD: https://login.salesforce.com
    steps:
      - name: Checkout branch (Feature Branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.Feature_Branch }}

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf --version

      - name: Install Salesforce Code Analyzer Plugin
        run: sf plugins install @salesforce/sfdx-scanner@latest || echo "Plugin already installed"

      - name: Generate JWT Key file
        run: echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key && chmod 600 server.key

      - name: Authorize to Salesforce org
        run: |
          # Determine login URL based on environment name
          LOGIN_URL="${{ env.SF_LOGIN_URL_TEST }}"
          if [[ "${{ github.event.inputs.environment }}" =~ ^EMAMI\s*(HOTFIX|UAT|QA)$ ]]; then
            # you can adjust logic as needed for prod/login URLs
            LOGIN_URL="${{ env.SF_LOGIN_URL_PROD }}"
          fi

          # Select appropriate secrets based on environment input
          case "${{ github.event.inputs.environment }}" in
            "EMAMI QA")
              CLIENT_ID="${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_QA }}"
              USERNAME="${{ secrets.SFDX_AUTH_EMAMI_QA_USERNAME }}"
              ;;
            "EMAMI QAGlobal")
              CLIENT_ID="${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_QAGLOBAL }}"
              USERNAME="${{ secrets.SFDX_AUTH_EMAMI_QAGLOBAL_USERNAME }}"
              ;;
            "EMAMI UAT")
              CLIENT_ID="${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_UAT }}"
              USERNAME="${{ secrets.SFDX_AUTH_EMAMI_UAT_USERNAME }}"
              ;;
            "EMAMI HOTFIX")
              CLIENT_ID="${{ secrets.SALESFORCE_CONSUMER_KEY_EMAMI_HOTFIX }}"
              USERNAME="${{ secrets.SFDX_AUTH_EMAMI_HOTFIX_USERNAME }}"
              ;;
            *)
              echo "Unknown environment: ${{ github.event.inputs.environment }}"
              exit 1
              ;;
          esac

          echo "Logging out previous sessions..."
          sf org logout --all --no-prompt || true

          echo "Authorizing to Salesforce org (${USERNAME}) with client id ${CLIENT_ID} and login url ${LOGIN_URL}..."
          sf org login jwt --client-id "${CLIENT_ID}" --jwt-key-file server.key --username "${USERNAME}" --instance-url "${LOGIN_URL}" --alias "${{ env.SF_ENV_ALIAS }}" --set-default

          sf org display --target-org "${{ env.SF_ENV_ALIAS }}"

      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-command: run
          run-arguments: --normalize-severity --target . --outfile results.json --json --verbose
          results-artifact-name: salesforce-code-analyzer-results

      - name: Display Salesforce Scanner Report Summary
        run: |
          echo "| Rule Id | Severity | File | Line | Message |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          jq -r '.[] | "|"+(.ruleId // "n/a")+"|"+(.severity // "n/a")+"|"+(.file // "n/a")+"|"+((.line|tostring) // "n/a")+"|"+(.message // "n/a")+"|"' results.json >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical errors found in scanner output
        if: |
          steps.run-code-analyzer.outputs.exit-code > 0 ||
          steps.run-code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.run-code-analyzer.outputs.num-violations > 10
        run: exit 1

      - name: Determine test classes for RunSpecifiedTests, if needed
        id: prepare_tests
        run: |
          if [[ "${{ github.event.inputs.testlevel }}" == "RunSpecifiedTests" ]]; then
            if [ -n "${{ github.event.inputs.specifiedclass }}" ]; then
              echo "Using specified test classes from input"
              TEST_CLASSES="${{ github.event.inputs.specifiedclass }}"
            else
              TEST_FILE="${{ github.workspace }}/manifest/${{ github.event.inputs.Feature_Branch }}_TestClass.txt"
              if [[ -f "$TEST_FILE" ]]; then
                TEST_CLASSES=$(paste -sd "," "$TEST_FILE")
                echo "Read test classes from file: $TEST_CLASSES"
              else
                echo "Error: Test classes file not found at '$TEST_FILE' and no classes specified via input"
                exit 1
              fi
            fi
            echo "test_classes=$TEST_CLASSES" >> $GITHUB_OUTPUT
          fi

      - name: Deployment Validation (CheckOnly)
        shell: bash
        run: |
          PACKAGE_XML="${{ github.workspace }}/manifest/${{ github.event.inputs.Feature_Branch }}_package.xml"
          echo "Validating deployment of package: $PACKAGE_XML"
          
          if [[ "${{ github.event.inputs.testlevel }}" == "RunSpecifiedTests" ]]; then
            TESTS="${{ steps.prepare_tests.outputs.test_classes }}"
            echo "Deploy with RunSpecifiedTests: $TESTS"
            sf project deploy validate --manifest "$PACKAGE_XML" --target-org "${{ env.SF_ENV_ALIAS }}" --test-level RunSpecifiedTests --tests "$TESTS" --wait 30
          else
            echo "Deploy with test level: ${{ github.event.inputs.testlevel }}"
            sf project deploy validate --manifest "$PACKAGE_XML" --target-org "${{ env.SF_ENV_ALIAS }}" --test-level "${{ github.event.inputs.testlevel }}" --wait 30
          fi

      - name: Actual Deployment
        shell: bash
        run: |
          PACKAGE_XML="${{ github.workspace }}/manifest/${{ github.event.inputs.Feature_Branch }}_package.xml"
          echo "Deploying package: $PACKAGE_XML"

          if [[ "${{ github.event.inputs.testlevel }}" == "RunSpecifiedTests" ]]; then
            TESTS="${{ steps.prepare_tests.outputs.test_classes }}"
            echo "Deploying with RunSpecifiedTests: $TESTS"
            sf project deploy start --manifest "$PACKAGE_XML" --target-org "${{ env.SF_ENV_ALIAS }}" --test-level RunSpecifiedTests --tests "$TESTS" --wait 10
          else
            echo "Deploying with test level: ${{ github.event.inputs.testlevel }}"
            sf project deploy start --manifest "$PACKAGE_XML" --target-org "${{ env.SF_ENV_ALIAS }}" --test-level "${{ github.event.inputs.testlevel }}" --wait 10
          fi

      - name: Cleanup
        run: rm -f server.key