name: PR Validation Against Destination Org

on:
  pull_request:
    branches:
      - SIT
      - QA
      - UAT
      - main

jobs:
  Pre_Validation_Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI and Git Delta Plugin
        run: |
          npm install -g @salesforce/cli
          sf --version
          echo "y" | sf plugins install sfdx-git-delta

      - name: Generate JWT Key File
        run: |
          echo "${{ secrets.SALESFORCE_JWT_SECRET_KEY }}" > server.key
          chmod 600 server.key

      - name: Set Source and Destination Branch
        shell: bash
        run: |
          echo "SOURCE_BRANCH=${{ github.head_ref }}" >> "$GITHUB_ENV"
          echo "DEST_BRANCH=${{ github.base_ref }}" >> "$GITHUB_ENV"

      - name: Select Salesforce Org Based on Destination Branch
        shell: bash
        run: |
          case "$DEST_BRANCH" in
            SIT)
              echo "SF_USERNAME=${{ secrets.SIT_USERNAME }}" >> "$GITHUB_ENV"
              echo "SF_INSTANCE_URL=${{ secrets.SANDBOX_URL }}" >> "$GITHUB_ENV"
              echo "SF_CLIENT_ID=${{ secrets.SALESFORCE_CONSUMER_KEY_SIT }}" >> "$GITHUB_ENV"
              ;;
            QA)
              echo "SF_USERNAME=${{ secrets.SFDX_AUTH_QA_USERNAME }}" >> "$GITHUB_ENV"
              echo "SF_INSTANCE_URL=${{ secrets.SANDBOX_URL }}" >> "$GITHUB_ENV"
              echo "SF_CLIENT_ID=${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}" >> "$GITHUB_ENV"
              ;;
            UAT)
              echo "SF_USERNAME=${{ secrets.SFDX_AUTH_UAT_USERNAME }}" >> "$GITHUB_ENV"
              echo "SF_INSTANCE_URL=${{ secrets.SANDBOX_URL }}" >> "$GITHUB_ENV"
              echo "SF_CLIENT_ID=${{ secrets.SALESFORCE_CONSUMER_KEY_UAT }}" >> "$GITHUB_ENV"
              ;;
            main)
              echo "SF_USERNAME=${{ secrets.SFDX_AUTH_QA_USERNAME }}" >> "$GITHUB_ENV"
              echo "SF_INSTANCE_URL=${{ secrets.SANDBOX_URL }}" >> "$GITHUB_ENV"
              echo "SF_CLIENT_ID=${{ secrets.SALESFORCE_CONSUMER_KEY_QA }}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Invalid target branch: $DEST_BRANCH"
              exit 1
              ;;
          esac

      - name: Authenticate Salesforce Using JWT
        run: |
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --set-default

      - name: Check if Package Manifest Exists
        id: check_package
        shell: bash
        run: |
          PKG_MANIFEST="${GITHUB_WORKSPACE}/manifest/${SOURCE_BRANCH}_package.xml"
          if [[ -f "$PKG_MANIFEST" ]]; then
            echo "package_exists=true" >> "$GITHUB_OUTPUT"
            echo "package_path=$PKG_MANIFEST" >> "$GITHUB_OUTPUT"
          else
            echo "package_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Validation Manifest and Test Classes
        id: prepare_manifest
        shell: bash
        run: |
          if [[ "${{ steps.check_package.outputs.package_exists }}" == "true" ]]; then
            echo "Using package manifest from ${{ steps.check_package.outputs.package_path }}"
            echo "manifest_path=${{ steps.check_package.outputs.package_path }}" >> "$GITHUB_OUTPUT"

            TEST_CLASS_FILE="${GITHUB_WORKSPACE}/manifest/${SOURCE_BRANCH}_TestClass.txt"
          else
            echo "Package manifest not found, generating delta package"

            mkdir -p delta
            git fetch origin "$DEST_BRANCH"
            git fetch origin "$SOURCE_BRANCH"

            sf sgd source delta \
              --from origin/"$DEST_BRANCH" \
              --to origin/"$SOURCE_BRANCH" \
              --output delta \
              --generate-delta

            DELTA_MANIFEST="${GITHUB_WORKSPACE}/delta/package/package.xml"
            echo "manifest_path=$DELTA_MANIFEST" >> "$GITHUB_OUTPUT"

            TEST_CLASS_FILE="${GITHUB_WORKSPACE}/delta/package/testclass.txt"
          fi

          if [[ -f "$TEST_CLASS_FILE" ]]; then
            TEST_CLASSES=$(<"$TEST_CLASS_FILE")
            # Trim leading/trailing whitespace and newlines
            TEST_CLASSES="${TEST_CLASSES#"${TEST_CLASSES%%[![:space:]]*}"}"
            TEST_CLASSES="${TEST_CLASSES%"${TEST_CLASSES##*[![:space:]]}"}"

            echo "Using test classes: $TEST_CLASSES"
            echo "test_classes=$TEST_CLASSES" >> "$GITHUB_OUTPUT"
            echo "test_level=RunSpecifiedTests" >> "$GITHUB_OUTPUT"
          else
            echo "Test class file not found, defaulting to RunLocalTests"
            echo "test_classes=" >> "$GITHUB_OUTPUT"
            echo "test_level=RunLocalTests" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Deployment against Target Org
        shell: bash
        env:
          TEST_LEVEL: ${{ steps.prepare_manifest.outputs.test_level }}
          TEST_CLASSES: ${{ steps.prepare_manifest.outputs.test_classes }}
          MANIFEST_PATH: ${{ steps.prepare_manifest.outputs.manifest_path }}
          SF_USERNAME: ${{ env.SF_USERNAME }}
        run: |
          # Split space-separated string into array (handles multiple test names)
          read -ra tests_array <<< "$TEST_CLASSES"

          CMD=(sf project deploy validate --target-org "$SF_USERNAME" --manifest "$MANIFEST_PATH"  --wait 60 --ignore-warnings --test-level "$TEST_LEVEL")

          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && ${#tests_array[@]} -gt 0 ]]; then
            CMD+=(--tests)
            for test in "${tests_array[@]}"; do
              CMD+=("$test")
            done
          fi

          CMD+=(--json)

          echo "Running command: ${CMD[*]}"
          "${CMD[@]}" > deploy-result.json
          cat deploy-result.json

      - name: Check Validation Result
        shell: bash
        run: |
          if [[ ! -f deploy-result.json ]]; then
            echo "No validation executed."
            exit 0
          fi
          STATUS=$(jq -r '.status' deploy-result.json)
          DEPLOY_STATUS=$(jq -r '.result.status // empty' deploy-result.json)
          echo "CLI Status: $STATUS"
          echo "Deployment Status: $DEPLOY_STATUS"
          if [[ "$STATUS" != "0" ]]; then
            echo "Validation failed."
            exit 1
          fi
          if [[ "$DEPLOY_STATUS" != "Succeeded" ]]; then
            echo "Deployment validation failed."
            exit 1
          fi
          echo "Validation passed successfully."

      - name: Remove JWT Key File
        if: always()
        run: rm -f server.key